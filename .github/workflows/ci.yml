name: Verifica e pacchetto sperimentale
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      npm_config_cache: ${{ github.workspace }}/.tools/npm-cache
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
      - run: mkdir -p .tools/tmp
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-version.mjs
  windows:
    needs: web
    runs-on: windows-latest
    env:
      npm_config_cache: ${{ github.workspace }}/.tools/npm-cache
      ELECTRON_CACHE: ${{ github.workspace }}/.tools/electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.tools/electron-builder-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/tmp | Out-Null
          "TEMP=$env:GITHUB_WORKSPACE/.tools/tmp" | Out-File $env:GITHUB_ENV -Append
          "TMP=$env:GITHUB_WORKSPACE/.tools/tmp" | Out-File $env:GITHUB_ENV -Append
      - run: npm ci
      - run: npm run desktop:dist
      - run: npm run desktop:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FILOCONTINUO-Windows-sperimentale
          path: |
            release/*Setup*.exe
            release/*.blockmap
          retention-days: 14
          if-no-files-found: error
